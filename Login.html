  <style>
    :root {
      --login-primary: #2c3e50;
      --login-secondary: #3498db;
      --login-accent: #e74c3c;
      --login-success: #27ae60;
      --login-light: #ecf0f1;
      --login-dark: #34495e;
      --login-white: #ffffff;
      --login-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --login-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('images/login.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.1;
      z-index: -1;
    }

    /* Navigation */
    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      border: none;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      padding: 1rem 0;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--login-primary) !important;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .navbar-brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .nav-link {
      color: var(--login-dark) !important;
      font-weight: 500;
      padding: 0.75rem 1.25rem !important;
      border-radius: 8px;
      transition: all 0.3s ease;
      margin: 0 0.25rem;
    }

    .nav-link:hover {
      background: var(--login-gradient);
      color: white !important;
      transform: translateY(-2px);
    }

    .nav-link.active {
      background: var(--login-secondary);
      color: white !important;
    }

    /* Mobile Navigation */
    @media (max-width: 768px) {
      .desaparece {
        display: none;
      }
      
      .nav-item:first-child {
        display: block !important;
      }
    }

    /* Login Container */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 3rem;
      box-shadow: var(--login-shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 450px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--login-gradient);
    }

    .login-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--login-primary);
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }

    .login-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--login-gradient);
      border-radius: 2px;
    }

    /* Form Styles */
    .form-floating {
      margin-bottom: 1.5rem;
    }

    .form-control {
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
    }

    .form-control:focus {
      border-color: var(--login-secondary);
      box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
      background: white;
    }

    .form-floating > label {
      color: #6c757d;
      font-weight: 500;
    }

    /* Checkbox */
    .form-check {
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-check-input {
      width: 1.2em;
      height: 1.2em;
      margin-right: 0.5rem;
      border: 2px solid var(--login-secondary);
    }

    .form-check-input:checked {
      background-color: var(--login-secondary);
      border-color: var(--login-secondary);
    }

    .form-check-label {
      color: var(--login-dark);
      font-weight: 500;
      cursor: pointer;
    }

    /* Buttons */
    .btn-container {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-modern {
      flex: 1;
      padding: 0.875rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-register {
      background: transparent;
      color: var(--login-secondary);
      border: 2px solid var(--login-secondary) !important;
    }

    .btn-register:hover {
      background: var(--login-secondary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
    }

    .btn-login {
      background: var(--login-gradient);
      color: white;
      border: 2px solid transparent !important;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      filter: brightness(1.1);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Loading State */
    .btn-loading {
      position: relative;
      color: transparent !important;
    }

    .btn-loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;
      border: 2px solid transparent;
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Response Area */
    #respuesta {
      margin-top: 1rem;
      text-align: center;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .login-card {
        padding: 2rem 1.5rem;
        margin: 1rem;
        border-radius: 16px;
      }

      .login-title {
        font-size: 1.75rem;
      }

      .btn-container {
        flex-direction: column;
      }

      .navbar {
        padding: 0.5rem 0;
      }

      .nav-link {
        padding: 0.5rem 1rem !important;
        margin: 0.25rem 0;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 1.5rem 1rem;
      }

      .login-title {
        font-size: 1.5rem;
      }

      .form-control {
        padding: 0.875rem;
      }
    }

    /* Animations */
    .login-card {
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Focus States */
    .btn-modern:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
    }

    .form-control:focus {
      outline: none;
    }
  </style>
</head>

  <div class="login-container">

      <form action="" id="sesion" method="post">
        <div class="form-floating">
          <input type="text" class="form-control" name="usuario" id="input_name" placeholder="Usuario" required>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Mobile menu toggle
    function accion() {
      var ancla = document.getElementsByClassName('nav-item');
      for (i = 1; i < ancla.length; i++) {
        ancla[i].classList.toggle('desaparece');
      }
    }

    // Password visibility toggle
    $(document).ready(function () {
      $('#password').click(function () {
        if ($('#password').is(':checked')) {
          $('#input_contra').attr('type', 'text');
          $('#label_contra').html('<i class="fas fa-eye-slash me-2"></i>Ocultar Contraseña');
        } else {
          $('#input_contra').attr('type', 'password');
          $('#label_contra').html('<i class="fas fa-eye me-2"></i>Mostrar Contraseña');
        }
      });

      // Form submission with loading state
      $('#sesion').on('submit', function(e) {
        const submitBtn = $('#btn-L');
        submitBtn.addClass('btn-loading');
        
        // Remove loading state after 3 seconds (adjust based on your needs)
        setTimeout(() => {
          submitBtn.removeClass('btn-loading');
        }, 3000);
      });

      // Input focus animations
      $('.form-control').on('focus', function() {
        $(this).parent().addClass('focused');
      }).on('blur', function() {
        if (!$(this).val()) {
          $(this).parent().removeClass('focused');
        }
      });
    });
  </script>
